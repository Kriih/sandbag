<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="currentColor" role="img" aria-label="Levantamiento Turco">
  <title>Levantamiento Turco</title>
  <!-- Kettlebell locked out overhead -->
  <path d="M88 34 C88 26, 104 26, 104 34" fill="none" stroke="currentColor" stroke-width="4.5"/>
  <circle cx="96" cy="22" r="11"/>
  <!-- Vertical locked arm -->
  <path d="M96 36 L96 102" fill="none" stroke="currentColor" stroke-width="11" stroke-linecap="round"/>
  <!-- Supporting arm down to floor -->
  <path d="M96 104 L68 136 L54 176" fill="none" stroke="currentColor" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Head looking up at kettlebell -->
  <circle cx="80" cy="96" r="12"/>
  <!-- Torso angled up from floor -->
  <path d="M96 104 L124 138" fill="none" stroke="currentColor" stroke-width="16" stroke-linecap="round"/>
  <!-- Front bent leg planted -->
  <path d="M124 138 L152 134 L158 176" fill="none" stroke="currentColor" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Back leg sweeping through -->
  <path d="M124 138 L104 166 L86 176" fill="none" stroke="currentColor" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Floor line -->
  <line x1="20" y1="182" x2="184" y2="182" stroke="currentColor" stroke-width="4" opacity="0.35" stroke-linecap="round"/>
</svg>
