<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="currentColor" role="img" aria-label="Curl de Bíceps en Anillas">
  <title>Curl de Bíceps en Anillas</title>
  <!-- Straps angled from overhead tree/anchor -->
  <line x1="148" y1="8" x2="116" y2="82" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
  <line x1="160" y1="8" x2="130" y2="86" stroke="currentColor" stroke-width="3" opacity="0.55" stroke-linecap="round"/>
  <!-- Rings near forehead -->
  <circle cx="114" cy="90" r="9" fill="none" stroke="currentColor" stroke-width="5"/>
  <circle cx="128" cy="94" r="8" fill="none" stroke="currentColor" stroke-width="4" opacity="0.55"/>
  <!-- Head -->
  <circle cx="80" cy="84" r="12"/>
  <!-- Rigid inclined body -->
  <path d="M90 98 L128 136 L168 176" fill="none" stroke="currentColor" stroke-width="15" stroke-linecap="round"/>
  <!-- Bent arm curling to ring (elbow high) -->
  <path d="M96 102 L120 112 L114 90" fill="none" stroke="currentColor" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Floor line -->
  <line x1="20" y1="184" x2="184" y2="184" stroke="currentColor" stroke-width="4" opacity="0.35" stroke-linecap="round"/>
</svg>
